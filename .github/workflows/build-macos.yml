name: Build macOS app

# GatoFlow: el .app se compila en runners macOS (PyInstaller no compila cruzado).
# Se dispara al publicar un release (cualquier tag, ej. v1.1) y adjunta los zips
# a ese mismo release; lanzamiento manual (Actions -> Run) solo sube artifacts
# para probar. Los tags mac-v* (ej. mac-v1.0) tambien disparan y crean su propio
# release. Matriz arm64 (Apple Silicon) + x64 (Intel) con Python 3.11: icono .icns
# best-effort, bundle --onedir firmado ad-hoc con texto de permiso de microfono,
# smoke test del binario windowed invocandolo directo (vivo 20 s = OK),
# empaquetado con ditto (preserva el bundle) con chequeo de tamano minimo.

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    tags:
      - "mac-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Generate .icns icon (best-effort)
        continue-on-error: true
        run: |
          mkdir -p assets/GatoFlow.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon.png --out "assets/GatoFlow.iconset/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2))
            sips -z $d $d assets/icon.png --out "assets/GatoFlow.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns assets/GatoFlow.iconset -o assets/icon.icns 2>/dev/null || \
            python -c "from PIL import Image; Image.open('assets/icon.png').save('assets/icon.icns')"

      - name: Freeze .app with PyInstaller
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir \
            --name GatoFlow \
            --icon "assets/icon.icns" \
            --osx-bundle-identifier com.gatoflow.app \
            --collect-binaries cv2 \
            --collect-all soundcard \
            --add-data "assets:assets" \
            main.py

      - name: Add microphone permission text
        run: |
          MSG="GatoFlow escucha la música que suena para acelerar al gato con el ritmo."
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string '$MSG'" \
            dist/GatoFlow.app/Contents/Info.plist || true

      - name: Ad-hoc sign (no Apple Developer account)
        run: |
          codesign --force --deep -s - dist/GatoFlow.app
          codesign --verify --deep --strict dist/GatoFlow.app

      - name: Smoke-test the frozen .app
        run: |
          QT_QPA_PLATFORM=offscreen ./dist/GatoFlow.app/Contents/MacOS/GatoFlow & APP_PID=$!
          sleep 20
          if kill -0 $APP_PID 2>/dev/null; then echo "SMOKE OK (app viva 20 s)"; kill -9 $APP_PID; else wait $APP_PID; code=$?; echo "SMOKE FAIL (exit $code)"; exit 1; fi

      - name: Package .app into a zip (ditto preserva el bundle)
        run: |
          ditto -c -k --keepParent dist/GatoFlow.app "dist/GatoFlow-macOS-${{ matrix.arch }}.zip"
          sz=$(stat -f%z "dist/GatoFlow-macOS-${{ matrix.arch }}.zip")
          echo "zip: $((sz / 1024 / 1024)) MB"
          if [ "$sz" -lt 20000000 ]; then echo "zip sospechosamente chico" >&2; exit 1; fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GatoFlow-macOS-${{ matrix.arch }}
          path: dist/GatoFlow-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GatoFlow-macOS-${{ matrix.arch }}.zip
